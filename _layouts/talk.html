---
layout: default
---
<article class="page">
  <h1 class="page-title">{{ page.title }}</h1>
  <p class="page-meta">{{ page.type }}{% if page.venue %} · {{ page.venue }}{% endif %}{% if page.date %} · {{ page.date | date: "%B %Y" }}{% endif %}{% if page.location %} · {{ page.location }}{% endif %}</p>
  {{ content }}
</article>
